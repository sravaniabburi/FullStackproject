<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCMXpertLite - Device Data</title>
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    /* Using styles similar to my_shipment.html for consistency */
    .data-box { background: rgba(99, 102, 241, 0.08); padding: 20px; border-radius: 12px; box-shadow: 0 0 12px rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.2); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; background: transparent; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; color: #333; }
    th { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #ffffff; font-weight: 600; }
    tr:hover { background: rgba(99, 102, 241, 0.05); }
    .filter-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filter-bar input { flex-grow: 1; padding: 10px; background: #ffffff; border: 2px solid #e2e8f0; color: #1e293b; border-radius: 8px; }
    .filter-bar input[type="number"] { max-width: 100px; }
    .filter-bar button { padding: 10px 16px; border: none; background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); color: #ffffff; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #dataMessage { text-align: center; margin-top: 15px; font-size: 0.95rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="account.html">My Account</a></li>
        <li><a href="my_shipment.html">My Shipment</a></li>
        <li><a href="New_shipment.html">New Shipment</a></li>
        <li><a href="device.html" class="active">Device Data</a></li>
        <li><a href="admin.html">Admin Tools</a></li>
      </ul>
      <a class="logout" href="#" id="logoutBtn">Logout</a>
    </aside>

    <main class="main-content">
      <h1>Device Data</h1>
      <div class="filter-bar">
        <input type="text" id="searchDeviceId" placeholder="Search by Device ID" />
        <input type="number" id="limitInput" value="20" min="1" max="100" title="Set number of results" />
        <button onclick="applyFilters()">Search</button>
      </div>

      <div class="data-box">
        <table id="deviceDataTable">
          <thead>
            <tr>
              <th>Device ID</th>
              <th>Battery Level</th>
              <th>First Sensor Temp</th>
              <th>Route From</th>
              <th>Route To</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="dataMessage"></p>
      </div>
    </main>
  </div>

  <script>
    const accessToken = localStorage.getItem("access_token");
    if (!accessToken) {
      window.location.href = "login.html";
    }

    async function fetchDeviceData(deviceId = "", limit = 20) {
      const tbody = document.querySelector("#deviceDataTable tbody");
      const messageElement = document.getElementById("dataMessage");
      tbody.innerHTML = "";
      messageElement.innerText = "Loading device data...";

      // Construct the URL with query parameters
      const params = new URLSearchParams();
      if (deviceId) {
        params.append("device_id", deviceId);
      }
      params.append("limit", limit);
      
      const url = `/device/data?${params.toString()}`;

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: { "Authorization": `Bearer ${accessToken}` }
        });

        if (response.ok) {
          const result = await response.json();
          const devices = result.data || [];

          if (devices.length === 0) {
            messageElement.innerText = "No device data found.";
            return;
          }

          devices.forEach(device => {
            const row = `<tr>
              <td>${device.Device_ID || 'N/A'}</td>
              <td>${device.Battery_Level !== undefined ? device.Battery_Level.toFixed(2) : 'N/A'}</td>
              <td>${device.First_Sensor_temperature !== undefined ? device.First_Sensor_temperature.toFixed(1) : 'N/A'}</td>
              <td>${device.Route_From || 'N/A'}</td>
              <td>${device.Route_To || 'N/A'}</td>
              <td>${device.timestamp ? new Date(device.timestamp).toLocaleString() : 'N/A'}</td>
            </tr>`;
            tbody.insertAdjacentHTML("beforeend", row);
          });
          messageElement.innerText = "";
        } else {
          const errorData = await response.json();
          messageElement.innerText = errorData.detail || "Failed to load device data.";
          messageElement.style.color = "tomato";
        }
      } catch (error) {
        console.error("Error fetching device data:", error);
        messageElement.innerText = "An error occurred while fetching data.";
        messageElement.style.color = "tomato";
      }
    }

    function applyFilters() {
      const deviceId = document.getElementById("searchDeviceId").value.trim();
      const limit = document.getElementById("limitInput").value;
      fetchDeviceData(deviceId, limit);
    }

    // Load initial data when the page loads
    document.addEventListener("DOMContentLoaded", () => {
        applyFilters();
    });

    document.getElementById("logoutBtn").addEventListener("click", async function(e) {
      e.preventDefault();
      // Logout logic remains the same
      localStorage.clear();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
